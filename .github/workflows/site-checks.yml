# Site checks for the portfolio: HTML validation, links, text rules, Lighthouse.
# Actions are pinned to commit SHAs (tag in the trailing comment).
name: Site checks

# External links only block the weekly and manual runs: a third-party site
# being briefly down should not fail an unrelated push or PR.
on:
  push:
  pull_request:
  schedule:
    - cron: "17 13 * * 1" # Mondays 13:17 UTC (9:17 AM Eastern in summer)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-checks-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  html:
    name: HTML validation
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Rules come from .htmlvalidate.json (standard + a11y presets)
      - run: npx --yes html-validate@11.16.2 "*.html"

  links:
    name: Link check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # 404.html uses absolute /portfolio/ paths (GitHub Pages serves it at any
      # depth), so map /portfolio/ onto the checkout for local file checks
      - name: Map /portfolio/ onto the checkout
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          ln -s "$GITHUB_WORKSPACE" "$RUNNER_TEMP/site/portfolio"
      # Internal links and files: always blocking
      - name: Internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config lychee.toml
            --offline
            --root-dir ${{ runner.temp }}/site
            './**/*.html' sitemap.xml
          output: lychee/internal.md
          fail: true
      # External http(s) links: reported in the job summary on every run, but
      # only fail the run on the weekly schedule or a manual run
      - name: External links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --config lychee.toml
            --scheme https --scheme http
            --root-dir ${{ runner.temp }}/site
            './**/*.html' sitemap.xml
          output: lychee/external.md
          fail: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}

  text:
    name: Text rules (em dashes, BOM, line endings)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python scripts/check-text.py .

  lighthouse:
    name: Lighthouse (performance warns, accessibility fails)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # 12.6.2
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false
